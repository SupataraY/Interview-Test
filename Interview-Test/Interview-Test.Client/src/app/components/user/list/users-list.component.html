<div class="container mt-4">
  <h2 class="mb-4">Users List</h2>

  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && !error">
    <div class="mb-3">
      <input
        type="text"
        class="form-control"
        placeholder="Search by id, userId, username, firstName, or lastName..."
        [(ngModel)]="keyword"
        (input)="search()"
      />
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover">
        <thead class="table-light">
          <tr>
            <th>User ID</th>
            <th>Username</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th># Roles</th>
            <th># Permissions</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of filteredUsers">
            <td>{{ u.userId }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.firstName }}</td>
            <td>{{ u.lastName }}</td>
            <td>{{ u.age ?? '-' }}</td>
            <td>{{ u.roles?.length || 0 }}</td>
            <td>{{ u.permissions?.length || 0 }}</td>
            <td>
              <a [routerLink]="['/users', u.userId]" class="btn btn-sm btn-primary">View Details</a>
            </td>
          </tr>
          <tr *ngIf="filteredUsers.length === 0">
            <td colspan="8" class="text-center">No users found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
