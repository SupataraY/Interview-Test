<h2>Users</h2>

<input
  type="text"
  class="form-control mb-3"
  placeholder="Search by id, userId, username, name"
  [(ngModel)]="keyword"
  (input)="search()"
/>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>UserId</th>
      <th>Username</th>
      <th>Name</th>
      <th>Age</th>
      <th>#Roles</th>
      <th>#Permissions</th>
      <th>Detail</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of filteredUsers">
      <td>{{ u.userId }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.name }}</td>
      <td>{{ u.age ?? '-' }}</td>
      <td>{{ u.roleCount }}</td>
      <td>{{ u.permissionCount }}</td>
      <td>
        <a [routerLink]="['/users', u.id]">View</a>
      </td>
    </tr>
  </tbody>
</table>
